services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass
      POSTGRES_DB: compass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      # Postgres accepts TCP a few seconds before it accepts queries.
      # Without this the API wins the race and dies on startup.
      test: ["CMD-SHELL", "pg_isready -U compass -d compass"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the service name — how containers reach each other. This real
      # env var overrides the localhost value in .env, which is the host's view.
      DATABASE_URL: postgresql+psycopg://compass:compass@db:5432/compass
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    ports: ["8000:8000"]
    volumes:
      - .:/app          # source mounted so --reload actually reloads
    command: uvicorn codecompass.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: